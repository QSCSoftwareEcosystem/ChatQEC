# ChatQEC root config (Hydra).
# Sub-configs live under conf/{retriever,synthesizer,ingestion}/ (added in later milestones).

project:
  name: chatqec
  version: "0.1.0-dev"

models:
  provider: "auto"                  # "auto" | "anthropic" | "gemini" | "huggingface" — auto tries Anthropic, then Gemini, then HF on credit/auth errors
  rewriter: claude-haiku-4-5
  classifier: claude-haiku-4-5
  synthesizer: claude-sonnet-4-6
  embedder: gemini-embedding-001
  long_context_fallback: gemini-2.5-pro
  reranker: mixedbread-ai/mxbai-rerank-base-v1   # Mixedbread AI, Apache-2.0; avoids China-origin BAAI/bge rerankers
  # Per-role overrides when provider="huggingface" (US-approved open-weights only).
  hf:
    classifier: "meta-llama/Llama-3.1-8B-Instruct"
    rewriter: "meta-llama/Llama-3.1-8B-Instruct"
    synthesizer: "meta-llama/Llama-3.3-70B-Instruct"
    judge: "meta-llama/Llama-3.3-70B-Instruct"
    vision: "meta-llama/Llama-4-Scout-17B-16E-Instruct"  # multimodal; used for image prompts
    serverless_provider: "auto"   # let huggingface_hub pick a routing partner
  # Per-role overrides when provider="gemini" (needs GEMINI_API_KEY or GOOGLE_API_KEY).
  gemini:
    classifier: "gemini-2.5-flash"
    rewriter: "gemini-2.5-flash"
    synthesizer: "gemini-2.5-pro"

retriever:
  top_k: 8
  candidate_k: 50
  alpha_vector: 0.5
  beta_bm25: 0.3
  gamma_tier: 0.15
  delta_recency: 0.05

paths:
  registry: sources/registry.jsonl
  watchlist: sources/watchlist.yaml
  canonical_dir: knowledge/canonical

store:
  qdrant_url: "http://localhost:6333"
  collection: "chatqec_chunks"
  vector_dim: 768
  on_disk_payload: true

embedding:
  provider: "gemini"        # "gemini" | "local"
  model: "gemini-embedding-001"  # text-embedding-004 was retired; gemini-embedding-001 is the GA replacement (3072-dim native, Matryoshka-truncatable to 768)
  batch_size: 96
  local_model: "nomic-ai/nomic-embed-text-v1.5"  # used when provider="local"

mcp:
  enabled: false
  server_command: "chatqec-mcp-tools"
  server_args: []
  request_timeout_seconds: 60

limits:
  ask_per_day: 20
  tool_per_hour: 5
  daily_budget_usd: 5.00
  per_query_wall_seconds: 30
  per_query_tool_iterations: 5
  per_query_chunks: 12
  per_query_output_tokens: 4000

captcha:
  enabled: false
  hcaptcha_sitekey: ""
  # hcaptcha_secret is read from HCAPTCHA_SECRET env var
