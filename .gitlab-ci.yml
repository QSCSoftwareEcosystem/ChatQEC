stages:
  - lint
  - validate-canonical
  - test

variables:
  UV_VERSION: "0.4.18"
  PYTHON_VERSION: "3.11"

.uv-base:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git build-essential
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv --version
    - uv sync --extra dev
  cache:
    key:
      files: [uv.lock]
    paths:
      - .venv/

lint:
  extends: .uv-base
  stage: lint
  script:
    - uv run ruff check src tests
    - uv run mypy src

test:
  extends: .uv-base
  stage: test
  script:
    - uv run pytest -v --cov=chatqec --cov-report=term-missing --cov-report=xml
  coverage: '/(?i)total.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

validate-canonical:
  extends: .uv-base
  stage: validate-canonical
  script:
    - uv run chatqec canonical --dir knowledge/canonical validate

network-tests:
  extends: .uv-base
  stage: test
  rules:
    - if: '$RUN_NETWORK_TESTS == "true"'
      when: always
    - when: manual
  script:
    - uv run pytest -v -m network

watchlist-refresh:
  extends: .uv-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
      when: always
  script:
    - uv run chatqec watch refresh --apply --registry sources/registry.jsonl
    - |
      if ! git diff --quiet sources/registry.jsonl; then
        BRANCH="auto/watchlist-$(date +%Y%m%d)"
        git config user.email "ci@chatqec"
        git config user.name "watchlist-refresh"
        git checkout -b "$BRANCH"
        git add sources/registry.jsonl
        git commit -m "chore(ingest): weekly watchlist refresh — $(date +%Y-%m-%d)"
        git push -o merge_request.create \
          -o merge_request.target=main \
          -o merge_request.title="chore(ingest): weekly watchlist refresh" \
          -o merge_request.description="Auto-generated by GitLab CI Schedule. Review the new pending_review records and merge to promote them." \
          "https://oauth2:${WATCHLIST_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "$BRANCH"
      else
        echo "no new candidates this week"
      fi
