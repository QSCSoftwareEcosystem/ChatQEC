[project]
name = "chatqec-mcp-tools"
version = "0.1.0"
description = "MCP server exposing sandboxed QEC tools (Stim v1; PyMatching/qiskit-qec v2) for use with Claude Desktop, Claude Code, and the ChatQEC app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sharmin Afrose", email = "sharmin.afrose.vt@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "mcp>=0.9,<2",
  "stim>=1.13",
  "matplotlib>=3.8",
  "pydantic>=2.8",
  "pymatching>=2.0",
  # Imported at module scope by tools/ibm_hardware/{_hardware_graph,_quality_model,
  # _circuits,_placement}.py, which server.py imports unconditionally to register
  # tools -- so networkx is needed by every install, not just the 'ibm' extra. It
  # previously resolved only by accident, as a transitive dependency of pymatching.
  "networkx>=3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]
lightstim = [
  "lightstim @ git+https://github.com/QuTone/LightStim@47dd74976780192ae901d91958863cced1165354",
]
tsim = [
  "bloqade-tsim>=0.1.5,<0.2",
]
ibm = [
  "qiskit>=1.0",
  "qiskit-ibm-runtime>=0.48",
  # networkx is a base dependency (see [project].dependencies) -- extras here
  # list only what the base install does not already pull in, matching the
  # lightstim/tsim extras above. rustworkx stays extra-only: it is a heavier
  # compiled extension used solely by _placement.place_vf2, which lazy-imports it.
  "rustworkx>=0.15",
]
decoders = [
    "bloqade-decoders>=0.6,<0.7",
    "tesseract-decoder>=0.1",
    "mwpf[stim]>=0.2",  # backend of bloqade-decoders MWPFDecoder, not pulled in by it
]
cudaq = [
    "cudaq-qec-cu13>=0.8.1,<0.9",
]
# Exact most-likely-error decoding (bloqade-decoders GurobiDecoder). The pip wheel ships
# Gurobi's restricted licence: size-limited and for NON-PRODUCTION use only (it says so on
# first use). Enough for small codes; larger models or production need your own licence.
# Tested on 3.11 with guppylang 0.21 / selene-sim 0.2 and on 3.13 with guppylang 1.2 / selene-sim 0.3
# (guppylang 1.x needs Python >= 3.12; measure() results need .read() there).
guppy = [
    "guppylang>=0.21,<2",
    "selene-sim>=0.2,<0.4",
]
# Tested with deltakit 0.9 (Python 3.11) and 0.10 (Python 3.13).
deltakit = [
    "deltakit>=0.9,<0.11",
]
# Qiskit 2.5 added the Clifford+T (gridsynth) and PBC preset pass managers.
ft = [
    "qiskit>=2.5",
]
paulice = [
    "qiskit-paulice",
    "qiskit>=1.0",
    "qiskit-aer",  # noisy stabilizer simulation for the postselection discard rate
]
mle = [
    "gurobipy>=12",
]

[project.scripts]
chatqec-mcp-tools = "chatqec_mcp_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatqec_mcp_tools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "I001", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["lightstim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tsim.*"]
ignore_missing_imports = true

# deltakit ships type hints and pulls in ldpc, whose .pyi stubs mypy cannot parse.
[[tool.mypy.overrides]]
module = ["deltakit", "deltakit.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chatqec_mcp_tools --cov-report=term-missing"
filterwarnings = [
  "error",
  # cudaq_qec imports cudaq, which warns about an upcoming sample/observe API change.
  "ignore:The CUDA-Q `sample` and `observe`:FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["chatqec_mcp_tools"]
