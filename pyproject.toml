[project]
name = "chatqec-mcp-tools"
version = "0.1.0"
description = "MCP server exposing sandboxed QEC tools (Stim v1; PyMatching/qiskit-qec v2) for use with Claude Desktop, Claude Code, and the ChatQEC app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sharmin Afrose", email = "sharmin.afrose.vt@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "mcp>=0.9,<2",
  "stim>=1.13",
  "matplotlib>=3.8",
  "pydantic>=2.8",
  "pymatching>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]
lightstim = [
  "lightstim @ git+https://github.com/QuTone/LightStim@47dd74976780192ae901d91958863cced1165354",
]
tsim = [
  "bloqade-tsim>=0.1.5,<0.2",
]
ibm = [
  "qiskit>=1.0",
  "qiskit-ibm-runtime>=0.48",
  "networkx>=3",
  "rustworkx>=0.15",
]

[project.scripts]
chatqec-mcp-tools = "chatqec_mcp_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatqec_mcp_tools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "I001", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["lightstim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tsim.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chatqec_mcp_tools --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["chatqec_mcp_tools"]
