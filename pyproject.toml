[project]
name = "chatqec"
version = "0.1.0"
description = "Semi-automated QEC research assistant with retrieval-augmented generation and sandboxed Stim execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sharmin Afrose", email = "sharmin.afrose.vt@gmail.com" },
]
keywords = ["quantum-error-correction", "qec", "rag", "llm", "anthropic", "gemini", "stim"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "anthropic>=0.40",
  "google-generativeai>=0.8",
  "qdrant-client[fastembed]>=1.12",
  "fastembed>=0.4",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "llama-index-readers-papers",
  "llama-index-readers-github",
  "llama-index-readers-youtube-transcript",
  "llama-index-readers-file",
  "trafilatura",
  "unstructured[pdf]",
  "streamlit>=1.40",
  "click>=8.1",
  "python-dotenv>=1.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "mcp>=0.9",
  "pydantic>=2.8",
  "slowapi",
  "tenacity",
  "arxiv",
  "rich",
]

[project.optional-dependencies]
vision = ["transformers>=4.49", "accelerate>=0.34", "torch>=2.2", "pillow>=10"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "nbmake>=1.5",  # executes notebooks/ as tests: pytest --nbmake notebooks/
]

[project.scripts]
chatqec = "chatqec.cli:main"

[project.urls]
Homepage = "https://code.ornl.gov/qsc-as/chatqec"
Repository = "https://code.ornl.gov/qsc-as/chatqec"
Issues = "https://code.ornl.gov/qsc-as/chatqec/-/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatqec", "chatqec_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "I001", "PLC0415"]
# Lazy imports for heavy/optional deps (trafilatura, requests, arxiv, unstructured).
# Auto-fix would move them to module-level and defeat cold-start optimisation.
"src/chatqec/cli.py" = ["PLC0415"]
"src/chatqec/eval/benchmarks/cli.py" = ["PLC0415"]       # lazy: heavy bot/provider imports
"src/chatqec/eval/benchmarks/__init__.py" = ["PLC0415"]  # lazy: adapters register on import
"src/chatqec/ingestion/fetchers/pdf.py" = ["PLC0415"]
"src/chatqec/ingestion/fetchers/arxiv.py" = ["PLC0415"]
"src/chatqec/ingestion/fetchers/arxiv_source.py" = ["PLC0415"]
"src/chatqec/ingestion/watchlist_refresh.py" = ["PLC0415"]
"src/chatqec/ingestion/figure_vision.py" = ["PLC0415"]
"src/chatqec/providers/huggingface.py" = ["PLC0415"]
"src/chatqec/providers/gemini.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["arxiv"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["unstructured.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trafilatura"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "google.generativeai",
  "sentence_transformers",
  "fastembed",
  "qdrant_client",
  "qdrant_client.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "chatqec.retrieval.reranker"
disallow_any_unimported = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chatqec --cov-report=term-missing -m 'not network'"
filterwarnings = ["error"]
markers = [
  "network: tests that require live network (arxiv, github, youtube, blog HTTP)",
]

[tool.coverage.run]
branch = true
source = ["chatqec"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
